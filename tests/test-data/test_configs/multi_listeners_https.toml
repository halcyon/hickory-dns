## One listener serving DNS-over-HTTPS on its own port (default /dns-query endpoint).
## Test runs bind an ephemeral port: the harness omits CLI port flags for listener
## configurations.

[tls_cert]
path = "tls/example.pem"
private_key = "tls/example.key"
endpoint_name = "ns.example.com"

[[listeners]]
address = "127.0.0.1"
port = 0
protocols = ["https"]

[[zones]]
zone = "example.com"
file = "example.com.zone"
